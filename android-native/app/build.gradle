plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

// Release signing, wired but not yet active locally: this file is what
// lets the real upload keystore start working the moment
// keystore.properties exists, with zero further Gradle changes. That
// keystore already exists validated as this repo's ANDROID_KEYSTORE_*
// secrets (used today to sign android/, the Capacitor app this module
// is replacing) - the CI release job below decodes it from those same
// secrets and writes exactly this properties file at build time; it is
// never committed (see .gitignore). Locally, a developer with the real
// keystore can drop the same file next to it. Until it exists,
// hasReleaseSigning stays false and the release build type is
// intentionally left with NO signingConfig - bundleRelease still
// succeeds, it just produces an unsigned .aab.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "one.zrp.social.mobile"
    compileSdk = 36

    defaultConfig {
        // Same applicationId the existing Capacitor app ships under -
        // this native app is the eventual replacement for that Play
        // Store listing (see the migration plan), not a second app.
        // The debug suffix below is what actually differs day-to-day.
        applicationId "one.zrp.social"
        minSdkVersion 24
        targetSdkVersion 36

        // Google Sign-In (Credential Manager) - this must be a Web-type
        // OAuth client ID from the SAME Google Cloud project as this
        // app's own registered Android OAuth clients (package
        // "one.zrp.social" + each signing certificate's SHA-1, see
        // google-services.json's own committed oauth_client entries and
        // GoogleAuth.kt's own KDoc). This is NOT the website's own
        // GOOGLE_CLIENT_ID (src/lib/auth.ts's GoogleProvider) - that
        // lives in a different Google Cloud project entirely and cannot
        // be reused here; reusing it is exactly the mistake that
        // produces Credential Manager's ambiguous NoCredentialException
        // even with a perfectly valid device/account (see
        // src/app/api/mobile/auth/google/route.ts's own comment, which
        // documents the same distinction server-side via the separate
        // GOOGLE_MOBILE_CLIENT_ID env var this value must match). Not a
        // secret (client IDs are public identifiers, unlike a client
        // secret) but still not hardcoded here, mirroring the
        // keystore.properties pattern above: supplied via a Gradle
        // property so a build with none configured still compiles -
        // GoogleAuth.kt's own call simply fails at runtime with a clear
        // error until it's set, instead of failing the build.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${project.findProperty('GOOGLE_WEB_CLIENT_ID') ?: ''}\""
        // versionCode 1 ("1.0") is the existing Capacitor app's Internal
        // Testing release - confirmed via Play Console there is no
        // Production release yet. This native app's own first release
        // was versionCode 2, per Play's per-applicationId monotonically-
        // increasing versionCode requirement; Play Console rejected a
        // later Internal Testing upload with "Le code de version 2 a
        // déjà été utilisé" (versionCode 2 already used - a prior AAB
        // with that code had already been uploaded), so that bumped to
        // versionCode 3, then 4 once Play confirmed 3 was uploaded too,
        // then 5 for the V4.0.1 real-device validation build, then 6
        // alongside versionName "4.0.2", then 7 alongside "4.0.3" - never
        // reuse a versionCode Play has already seen for this
        // applicationId. Play rejected an Internal Testing upload again
        // with "Le code de version 7 a déjà été utilisé", so this bumps
        // to versionCode 8 / versionName "4.0.4" - the 4.0.4 milestone
        // (real presence consuming server.js's existing user-status/
        // get-status broadcast, real group chat with its own Conversation/
        // ConversationParticipant schema and Socket.IO events, tablet
        // two-pane messaging, an advanced profile experience pass, and a
        // link-preview regression fix) for real-user Play testing. Bumped
        // again to versionCode 9 (versionName unchanged - still the 4.0.4
        // milestone, no new feature here) to ship GoogleAuth.kt's own
        // on-device NoCredentialException diagnostic: real Internal
        // Testing users hit "Google Sign-In couldn't find an account to
        // use" on versionCode 8 with a real Google account present, which
        // this repo's own history (see GoogleAuth.kt's KDoc) already
        // shows is ambiguous between a device-side cause and a
        // misconfigured GOOGLE_WEB_CLIENT_ID - this build surfaces the
        // actual configured (non-secret) client ID value directly in that
        // error message so the real cause can be confirmed from the
        // device alone. versionCode 9 was built and committed here but
        // was never uploaded to Play - versionCode 8 (4.0.4) remained the
        // latest Internal Testing release, so it is the confirmed
        // baseline for this bump, not 9. Since 8 shipped, GoogleAuth.kt
        // gained a real second fix on top of the versionCode 9 diagnostic:
        // an explicit "Sign in with Google" chooser (GetSignInWithGoogleOption)
        // that retries automatically when the quiet GetGoogleIdOption path
        // answers NoCredentialException, which is Google's own documented
        // fallback for that exact failure and is expected to resolve it
        // for real testers rather than just diagnosing it. Play Console
        // also now carries a full admin parity pass built on this same
        // main history: Support Tickets, the moderation/verification
        // queues, financial workflows, internal ops tooling, and the ZRP
        // News CMS + News Network console - all server-authorized via
        // existing requireStaff/requireAdmin route checks, none of it
        // changing end-user-facing behavior. That combination is a real
        // milestone beyond 4.0.4, so this bumps to versionCode 10 /
        // versionName "4.0.5", never reusing 9 or 8 per Play's
        // monotonically-increasing versionCode requirement for this
        // applicationId (see the versionCode 2/7 rejections above).
        // Bumps again to versionCode 11 / versionName "4.0.6" for two
        // further, real fixes landed on top of 10: allowBackup is now
        // false and androidx.security:security-crypto moved off its
        // alpha build to the stable 1.1.0 release (same MasterKey API
        // TokenStore already used - see AndroidManifest.xml's own
        // comment), and editorial feed accounts (ZRP News World, ZRP
        // Travel, ...) - which showed correctly on web but had no
        // avatar, banner, or "editorial" badge on Android - are fixed:
        // EDITORIAL_AVATAR_URL/EDITORIAL_COVER_URL are now fully-
        // qualified https:// URLs instead of root-relative paths Coil
        // has no origin to resolve, and VerifiedBadge.kt's BadgeStyles
        // map now has the "editorial" entry it was missing (see
        // VerifiedBadge.kt's own comment). Neither changes applicationId,
        // signing, or deep links.
        //
        // Bumps to versionCode 12 / versionName "4.0.7" for a real
        // Google Sign-In fix: the account picker opened, an account
        // could be selected, and then nothing happened - no login, no
        // error. Root cause was CredentialManager.getCredential()'s
        // result being tied to the specific Activity instance that made
        // the request, while this Activity had no configChanges
        // declared and the request itself ran on a Composable-scoped
        // rememberCoroutineScope() rather than AuthViewModel's
        // viewModelScope - so any configuration change while the system
        // account picker had focus (rotation, fold/unfold, a uiMode/
        // density nudge some OEM skins apply when a system bottom sheet
        // appears) silently discarded the whole in-flight request. Fixed
        // by declaring configChanges on MainActivity and moving the
        // entire Google sign-in round trip onto viewModelScope (see
        // AuthViewModel.loginWithGoogle's own comment). Email/password
        // auth, applicationId, signing and deep links are unchanged. 11
        // was never confirmed uploaded to Play, but per this file's own
        // convention (see the versionCode 9/10 history above) the next
        // build always strictly increments past the highest versionCode
        // ever committed here, not just the last one confirmed shipped.
        //
        // Bumps to versionCode 13 / versionName "4.0.8" for five fixes
        // (PR #229): a real second layer for Google Sign-In
        // (GoogleSignInAttemptMarker - detects the app's PROCESS being
        // killed outright while the account picker has focus, which the
        // configChanges/viewModelScope fix above does not cover, and
        // surfaces a real error instead of silence); defensive hardening
        // of Android poll voting against a reported crash on tap (root
        // cause not confirmed - no crash-reporting SDK, no device); the
        // Shorts composer's video preview no longer squishing to the
        // wrong aspect ratio and crowding its own playback controls into
        // the caption field; the fullscreen photo viewer's close button
        // no longer sitting under the system status bar, and tapping the
        // photo itself now closes it; and the Shorts-style action rail
        // (like/comment/repost/share) no longer hidden behind BottomNav
        // on mobile web/PWA/tablet. None of this changes applicationId,
        // signing, or deep links. 12 was confirmed uploaded to Play
        // Internal Testing.
        //
        // Bumps to versionCode 14 / versionName "4.0.9" for the real
        // root cause of "polls not publishing correctly" (PR #233): the
        // poll create/vote/fetch API pipeline was already correct
        // end-to-end, but the website's own PostCard.tsx - the shared
        // component every post-listing page renders through - never
        // imported or rendered the existing Poll component, so a
        // published poll saved and was voteable but never appeared as a
        // poll anywhere in the UI. Also fixes several backend routes
        // (profile posts/likes/reposts, search, hashtag, quotes,
        // bookmarks) that never selected a post's poll data at all -
        // this app's own native screens hitting those same endpoints
        // (e.g. profile posts) now receive real poll data from them too.
        // No android-native Kotlin source changed in this release; the
        // fix is entirely in the shared Next.js backend/web frontend.
        // None of this changes applicationId, signing, or deep links.
        // 13 was confirmed uploaded to Play Internal Testing.
        //
        // Bumps to versionCode 15 / versionName "4.0.10" to rebuild with
        // a corrected GOOGLE_WEB_CLIENT_ID repo secret. GOOGLE_WEB_CLIENT_ID
        // is compiled into the app at build time (see GoogleAuth.kt's own
        // comment and this file's own GOOGLE_WEB_CLIENT_ID buildConfigField
        // wiring above) - it must be byte-identical to Railway's
        // GOOGLE_MOBILE_CLIENT_ID, since that's the value the backend's
        // POST /api/mobile/auth/google accepts as a token audience (see
        // that route's own comment on why web and mobile use two separate
        // Google Cloud OAuth clients). The two had never been directly
        // compared before; 14's AAB was built before this secret was
        // re-verified, so this rebuild is the first one confirmed to
        // carry the checked value. No android-native Kotlin source
        // changed. None of this changes applicationId, signing, or deep
        // links. 14 was not confirmed uploaded to Play; 15 WAS uploaded
        // and real-device tested - that real test is what reproduced the
        // actual bug (see the 16 entry below).
        //
        // Bumps to versionCode 16 / versionName "4.0.11" carrying real-
        // device diagnosis of the Google Sign-In failure 15 reproduced:
        // account picker opens, an account is selected, and the app
        // lands back on a blank, unauthenticated Login screen - even
        // when the attempt started from Signup. Fixes one concrete,
        // confirmed bug (ZrpSocialApp's loggedOutScreen was plain
        // `remember`, losing Signup/ForgotPassword across an Activity
        // recreation not covered by configChanges - most plausibly the
        // OS killing the backgrounded process during the external
        // account picker, exactly what GoogleSignInAttemptMarker exists
        // to detect - now `rememberSaveable`). That alone does not
        // explain "not authenticated": if the sign-in itself had
        // succeeded, the surviving ViewModel auth state would have swept
        // the user into the home feed regardless of which screen was
        // showing, and manual password login would not have been
        // needed. This build additionally carries diagnostic logging
        // (GoogleAuth.kt, MainActivity.kt, AuthViewModel.kt, and the
        // backend's /mobile/auth/google route, which previously had a
        // completely blind catch around its own token verification) at
        // every checkpoint between "account selected" and "session
        // established" - never logging the token, password, or any
        // secret - specifically so THIS build's own real-device retest
        // can show, from Logcat, exactly where the chain actually
        // breaks. None of this changes applicationId, signing, or deep
        // links.
        // Bumps to versionCode 17 / versionName "4.0.12" for a premium-
        // quality/navigation pass across the Settings and Search
        // surfaces plus every remaining screen domain (PRs #260, #261,
        // #264, #265) - no backend, auth, or route-contract changes:
        //
        // - Settings' Legal section (grown to 12 flat rows by this same
        //   session's earlier institutional-page work) regrouped into
        //   labeled Company/Support/Legal clusters, reusing the
        //   website's own real translated group headings (#260).
        // - Search's 8 Discover feature-vertical rows (Music,
        //   Marketplace, Opportunity, Aid, Play, News, Shorts, AI) get
        //   the same trailing-chevron navigation affordance Settings
        //   rows already have, and 8 near-identical row composables
        //   collapsed into one shared one (#261).
        // - Across Admin/News/Journalist/Support/Trust/Messages/
        //   Notifications/Profile/Home/Create/Bookmarks/Hashtag/
        //   Comments/Quotes/Reposts/FollowList/Creator: the quote-post
        //   composer gains an on-screen dismiss it was missing, ticket
        //   rows get the same trailing-chevron affordance, 7 more
        //   "name text pushes VerifiedBadge off the row" sites are
        //   fixed (including the main feed's own PostCard header - the
        //   highest-traffic instance of this recurring bug), a voice-
        //   message play/pause button gains a real accessible name, and
        //   two under-sized IconButtons are restored to the 48dp
        //   minimum touch target (#264).
        // - Across Music/Marketplace/Opportunity/Aid/Play: ~35 bare
        //   `clickable` rows gain proper Role.Button semantics for
        //   TalkBack, 9 more instances of the same text-eviction bug are
        //   fixed, an icon-only remove-photo button gains a real
        //   accessible name and its touch target restored, and 12 bare
        //   "no results" screens now use the app's real shared empty-
        //   state component instead of a bare centered sentence (#265).
        //
        // Also carries a documentation-only fix (#263): README's env-var
        // list was missing GOOGLE_MOBILE_CLIENT_ID, which the mobile
        // Google Sign-In backend route requires - no application code
        // changed by that PR. A parallel, independent re-audit of the
        // full Google Sign-In flow (client + server) found every
        // previously-shipped fix still correctly in place and no new
        // code-level bug; Google Sign-In itself is unchanged in this
        // release. None of this changes applicationId, signing, or deep
        // links.
        //
        // Bumps to versionCode 18 / versionName "4.0.13" for native
        // Android parity with the web/PWA ZRP Global Ambassador Program
        // (PR #269), built by inspecting the Front Agent's real, already-
        // merged implementation (PR #267 - schema, all 6 API routes,
        // validation rules, all 4 page components, full translation
        // inventory) rather than assuming a spec: a public overview
        // (Hero, Country Explorer over the real, complete 250-country
        // dataset fetched live from GET /api/ambassadors/countries - no
        // hardcoded country list, Ambassador levels section), a full
        // application form, a status dashboard that always re-fetches
        // GET /api/ambassadors/me (status/level are never trusted
        // client-side), and an admin review queue mirroring
        // AdminJournalistsScreen's own established pattern (status
        // filter chips, search, confirm/reason dialogs for destructive
        // actions). Wired into Settings' Company group, the Admin
        // dashboard's staff quick actions, and ZrpNavHost. 96 new string
        // keys across all 11 locales, reusing existing admin_journalists_*/
        // admin_reports_* copy for shared verbs rather than duplicating
        // strings. Deliberately does not add a native interactive world-
        // map visualization (the Country Explorer is the complete,
        // independently accessible path to any of the 250 countries -
        // see AmbassadorsScreen.kt's own KDoc) or fabricate community-
        // activity/achievements/leaderboard sections that have no real
        // backing model yet. None of this changes applicationId, signing,
        // or deep links.
        //
        // Bumps to versionCode 19 / versionName "4.0.14" for the
        // conversation-list "Delete conversation" fix: a real, permanent
        // whole-1:1-conversation delete (DELETE
        // /api/messages/conversation/[userId], already existed
        // server-side) was reachable nowhere in this app before - no
        // client code here ever called it. Adds the missing Retrofit
        // endpoint, repository/ViewModel wiring (including the same
        // realtime "delete-conversation" socket relay the website
        // already uses), and an always-visible overflow button + confirm
        // dialog on each direct conversation row in MessagesScreen.
        // Matches the same feature just added to web/PWA/desktop. None
        // of this changes applicationId, signing, or deep links.
        //
        // Bumps to versionCode 20 / versionName "4.0.15": versionCode 19
        // was independently produced by two different PRs merged into
        // main in quick succession (this one and the earlier native
        // redesign PR), and Play Console rejected a second upload
        // attempt at versionCode 19 ("Le code de version 19 a déjà été
        // utilisé") since it had already accepted one AAB carrying that
        // versionCode. No feature change here - version numbers only.
        //
        // Bumps to versionCode 21 (versionName unchanged - still the
        // 4.0.15 milestone, this branch's real Communities + Lists work
        // is the feature content, not a version-number change) because
        // versionCode 20 was already uploaded to Play Console's Internal
        // Testing track before this branch's AAB was built, so a build
        // of this branch carrying the inherited 20 would collide with it
        // ("Le code de version 20 a déjà été utilisé" - same failure
        // mode as the versionCode 2/7/19 collisions documented above).
        versionCode 21
        versionName "4.0.15"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
        // Without this, Gradle falls back to its own auto-generated
        // ~/.android/debug.keystore - created fresh (different SHA-1)
        // on every machine and, critically, on every single GitHub
        // Actions run, since CI runners are ephemeral. Google Sign-In
        // (Credential Manager's GetGoogleIdOption) refuses to return a
        // credential from any app whose signing certificate isn't
        // registered against an OAuth client in the same Google Cloud
        // project as GOOGLE_WEB_CLIENT_ID - confirmed by
        // google-services.json's own "oauth_client": [] (nothing
        // registered at all yet). A constantly-changing debug
        // fingerprint would make that registration impossible to keep
        // working, so this checked-in keystore (see its own comment)
        // exists purely to give the debug build ONE stable, real
        // fingerprint that can actually be registered once. Standard,
        // safe practice: a debug keystore's password is always the
        // well-known Android default below, never a real secret.
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // No applicationIdSuffix here (there was one, ".native", for
            // side-by-side installs with the existing Capacitor app
            // during earlier phases): Firebase/FCM requires the built
            // APK's applicationId to exactly match a package_name
            // registered in google-services.json, and this Firebase
            // project has exactly one Android app registered, for
            // "one.zrp.social" - the same id defaultConfig already
            // declares. A suffixed debug build would fail
            // processDebugGoogleServices with "No matching client
            // found". Side-by-side installs during development now mean
            // uninstalling the Capacitor build first.
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')

    implementation 'androidx.core:core-ktx:1.13.1'

    // Per-app language switching (Settings > Language) - AppCompatDelegate.
    // setApplicationLocales()/getApplicationLocales() is the officially
    // recommended API for this, delegating to the framework LocaleManager
    // on API 33+ and to its own AppLocalesMetadataHolderService-backed
    // storage below that (see the matching AndroidManifest.xml service
    // entry). MainActivity is now an AppCompatActivity itself (required
    // separately, so the new locale's string resources actually reapply
    // on recreate() below Android 13 - see MainActivity's own comment).
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'

    // Encrypted local storage for the session token (Phase 3, Auth) -
    // a plain SharedPreferences file is just a world-readable-by-the-
    // app XML file on disk; this backs it with an Android Keystore-
    // derived key instead, the same mechanism NextAuth's httpOnly
    // cookie protects the equivalent value with on the web.
    //
    // The MasterKey/MasterKey.Builder API (as opposed to the older,
    // now-deprecated MasterKeys.getOrCreate() static helper) only
    // exists from 1.1.0-alpha03 onward - the true stable 1.0.0 release
    // predates it and does not have this class at all, despite already
    // shipping EncryptedSharedPreferences itself. 1.1.0 is the first
    // stable release carrying it (this was pinned to the pre-release
    // 1.1.0-alpha06 before - an alpha of a crypto library has no place
    // guarding a production session token). The classes TokenStore uses
    // are unchanged in 1.1.0; it emits deprecation warnings only, which
    // this build does not treat as errors.
    implementation 'androidx.security:security-crypto:1.1.0'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // Real window-size-class detection (tablet/large-screen two-pane
    // messaging) - Google's own calculateWindowSizeClass(Activity), not
    // a fixed dp guess. Version comes from the compose-bom platform
    // import above, same as every other material3 artifact in this file.
    implementation 'androidx.compose.material3:material3-window-size-class'
    // Home feed's pull-to-refresh (Phase 4) - Material2's
    // rememberPullRefreshState/pullRefresh/PullRefreshIndicator, not
    // Material3's newer PullToRefreshBox, since this app is otherwise
    // on Compose BOM 2024.09.00 and the Material2 API is the
    // long-stable, compile-reliable one at that BOM version.
    implementation 'androidx.compose.material:material'
    implementation 'androidx.navigation:navigation-compose:2.8.1'

    // Networking foundation for Phase 3 (auth) onward - the ZRP REST
    // API (src/app/api/**) is plain JSON, so a standard Retrofit/OkHttp
    // stack talks to it directly with no backend changes required for
    // the request/response shapes themselves.
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Real-time messaging parity - the same Socket.IO server the website's
    // src/lib/socket-client.ts talks to (server.js, "socket.io": "^4.7.0"),
    // reached over the exact same NextAuth session cookie ApiClient's own
    // sessionCookieInterceptor already attaches to every REST call (see
    // ZrpSocket's own KDoc). org.json is excluded because engine.io-client
    // pulls in a standalone org.json:json jar that duplicates classes
    // already provided by the Android platform, which fails the build at
    // dex-merge time otherwise.
    implementation('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }

    // Google Sign-In - Android's Credential Manager API, which returns a
    // signed Google ID token directly (an account picker, no browser
    // redirect). This is a genuinely different mechanism from the
    // Capacitor app's own nativeGoogleSignIn() (src/lib/nativeAuth.ts,
    // system-browser redirect) - that one exists solely to work around
    // Google blocking OAuth from an *embedded WebView*, which doesn't
    // apply here since this app has no WebView at all. Verified server-
    // side by src/app/api/mobile/auth/google/route.ts against the same
    // GOOGLE_CLIENT_ID the website's own GoogleProvider already trusts.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Real video story playback (Stories parity) - Google's own,
    // long-stable Compose-friendly video stack. StoryViewerScreen wraps
    // ExoPlayer's PlayerView via AndroidView; media3-ui supplies that
    // view class, media3-exoplayer the actual player/decoder.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // Real background playback for ZRP Music (lock-screen/notification
    // controls, foreground-service-backed playback that survives the
    // app being backgrounded) - MusicPlaybackService.kt. Same 1.4.1
    // version as the two media3 artifacts above to avoid a mixed-version
    // resolution.
    implementation 'androidx.media3:media3-session:1.4.1'

    // Push notifications (Phase 13) - real device registration tokens
    // and real message receipt via Firebase Cloud Messaging. The BoM
    // pins a mutually-compatible set of Firebase library versions, so
    // firebase-messaging-ktx below doesn't declare its own version.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // Real voice/video calling (Messaging parity) - the same WebRTC
    // protocol ChatInterface.tsx/page.tsx already use via simple-peer
    // (browser RTCPeerConnection), signaled over the exact same
    // call-user/incoming-call/accept-call/call-accepted/reject-call/
    // end-call Socket.IO events server.js already relays, and the same
    // real /api/turn-credentials ICE servers (see CallViewModel's own
    // KDoc for the full wire-protocol mapping). google-webrtc itself
    // stopped publishing to Maven Central in 2023; this is the actively
    // maintained community build of the same upstream libwebrtc used
