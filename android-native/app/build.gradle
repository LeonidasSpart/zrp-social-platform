plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "one.zrp.social.mobile"
    compileSdk = 36

    defaultConfig {
        // Same applicationId the existing Capacitor app ships under -
        // this native app is the eventual replacement for that Play
        // Store listing (see the migration plan), not a second app.
        // The debug suffix below is what actually differs day-to-day.
        applicationId "one.zrp.social"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "0.1.0-foundation"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // Lets this build install side-by-side with the existing
            // Capacitor app (applicationId "one.zrp.social") on the same
            // test device during the transition - Android treats
            // "one.zrp.social" and "one.zrp.social.native" as unrelated
            // apps. Drop this suffix at the actual cutover release.
            applicationIdSuffix ".native"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'

    // Encrypted local storage for the session token (Phase 3, Auth) -
    // a plain SharedPreferences file is just a world-readable-by-the-
    // app XML file on disk; this backs it with an Android Keystore-
    // derived key instead, the same mechanism NextAuth's httpOnly
    // cookie protects the equivalent value with on the web.
    //
    // The MasterKey/MasterKey.Builder API (as opposed to the older,
    // now-deprecated MasterKeys.getOrCreate() static helper) only
    // exists from 1.1.0-alpha03 onward - the true stable 1.0.0 release
    // predates it and does not have this class at all, despite already
    // shipping EncryptedSharedPreferences itself.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.1'

    // Networking foundation for Phase 3 (auth) onward - the ZRP REST
    // API (src/app/api/**) is plain JSON, so a standard Retrofit/OkHttp
    // stack talks to it directly with no backend changes required for
    // the request/response shapes themselves.
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'io.coil-kt:coil-compose:2.7.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
