pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // LiveKit's Android SDK (ZRP Live Audio) pulls in
        // com.github.davidliu:audioswitch as a transitive dependency, which is
        // only published on JitPack, not Maven Central/Google.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "ZRP Social"
include ':app'
