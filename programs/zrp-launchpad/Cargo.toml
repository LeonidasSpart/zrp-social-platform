[package]
name = "zrp-launchpad"
version = "0.1.0"
description = "ZRP-native Solana bonding-curve launch protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zrp_launchpad"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }

# Pins a transitive dependency this crate never calls directly. cargo
# build-sbf (invoked by `anchor build`) uses Solana's own bundled
# "platform-tools" cross-compiler to build the on-chain program - a
# fixed, old Cargo (1.79 as of SOLANA_VERSION 2.1.0, see
# .github/workflows/solana-program-ci.yml) that predates the Cargo
# `edition2024` feature. Confirmed via `cargo tree -i zeroize` (run with
# the host's modern cargo, which does support edition2024): zeroize is
# pulled in transitively through anchor-spl's spl-token-2022
# confidential-transfer sub-crates (solana-zk-sdk and its own
# dependents aes-gcm-siv, curve25519-dalek, merlin), each declaring a
# loose "^1"/"^1.7"-style zeroize requirement that has since floated to
# zeroize 1.9.0, which itself requires edition2024. 1.8.2 is the newest
# zeroize release that is still edition2021 and satisfies every one of
# those requirements (checked against each dependent's own declared
# range via crates.io), so declaring it directly here - even though
# this crate's own code never imports it - forces the workspace's
# single unified dependency graph to use that version everywhere
# instead of floating to the newest edition2024 release.
zeroize = "=1.8.2"

# zeroize's own optional "derive" dependency floats independently of
# zeroize itself: zeroize 1.8.2 declares `zeroize_derive = "^1.3"`
# (optional, activated transitively by the confidential-transfer code
# above), and that range let it resolve to zeroize_derive 1.5.0, which
# itself is edition2024. 1.4.2 is the newest zeroize_derive release
# still on edition2021 and satisfies the same "^1.3" range. Found this
# by scanning every resolved package in Cargo.lock against crates.io's
# per-version `edition` field, not by waiting for cargo build-sbf to
# hit it - same reasoning as the other pins in this file, just
# discovered locally with a modern host cargo before pushing instead
# of needing another CI round trip.
zeroize_derive = "=1.4.2"

# Same pattern as zeroize above, hit on the very next CI run after that
# pin was confirmed working: `anchor build` failed parsing
# toml_edit-0.25.15+spec-1.1.0's manifest, "feature `edition2024` is
# required". toml_edit 0.25.6 bumped to edition2024; 0.25.5 is the
# newest release still on edition2021, and - since Cargo treats the
# first nonzero component of a pre-1.0 version as its compatibility
# class - it satisfies the same "^0.25" range every real dependent in
# the graph (cargo_toml, spl-discriminator-syn, and their own anchor-
# proc-macro dependents) already declares. (Build metadata dropped from
# the version string: Cargo ignores "+..." suffixes for matching
# purposes and warns if one is present in an exact requirement.)
toml_edit = "=0.25.5"

# toml_edit 0.25.5 is itself split across three sibling crates
# (toml_datetime/toml_writer/toml_parser - the "toml" ecosystem's
# newer modular layout) that each bumped independently to edition2024
# one minor version above what toml_edit 0.25.5 actually requires.
# toml_edit's own declared ranges ("^1.0.1"/"^1.0.7"/"^1.0.10") have
# their lower bound sitting exactly on the last edition2021 release of
# each, so pinning to that floor satisfies toml_edit while avoiding
# the edition2024 releases the unpinned caret range would float to.
toml_datetime = "=1.0.1+spec-1.1.0"
toml_writer = "=1.0.7+spec-1.1.0"
toml_parser = "=1.0.10+spec-1.1.0"

# Third crate in the same cascade, hit on the CI run after the toml_edit
# fix: `digest v0.11.3` itself declares `edition = "2024"` - and every
# release in digest's 0.11.x line (0.11.0/0.11.1 yanked, 0.11.2, 0.11.3)
# does the same, so digest can't be pinned within its own compatibility
# class the way zeroize/toml_edit were. One level up: the chain pulling
# it in is crypto-common 0.2.2 -> digest 0.11.3 -> blake3 1.8.7 ->
# solana-blake3-hasher -> solana-program. solana-blake3-hasher 2.2.1
# declares a loose "^1.5.5" requirement on blake3 (not pinned to the
# newest release), and blake3 1.5.5 itself declares only "digest =
# ^0.10.1" (optional, "mac" feature) - so pinning blake3 down to 1.5.5
# satisfies solana-blake3-hasher's own range while skipping the
# digest-0.11.x/edition2024 chain entirely.
#
# Security check performed per project requirement before pinning: the
# only relevant advisory in this version range is RUSTSEC-2026-0260, a
# supply-chain attack via a single malicious `arrayref 0.3.10` release
# that blake3 depends on. It affects exactly that one version; it was
# removed (not yanked) from crates.io ~86 minutes after publication, so
# it can never be freshly resolved by any `cargo generate-lockfile` run
# again regardless of which blake3 version is chosen here - this is not
# a live risk from the downgrade. Note for the record: blake3 1.8.7 is
# itself the release that *fixed* that incident by dropping the
# arrayref dependency entirely, so pinning back to 1.5.5 does reinstate
# a (structurally dormant, not exploitable) dependency on arrayref via
# a "^0.3.5" range; no CVE/RUSTSEC advisory was found against blake3's
# own hashing implementation anywhere in the 1.5.5-1.8.7 range.
blake3 = "=1.5.5"

# Fourth crate in the cascade, surfaced by the blake3 fix itself: the
# toml_edit 0.25.5 pin above pulls in `indexmap`, which CI resolved to
# 2.14.2 - and indexmap bumped to `edition = "2024"` (and to requiring
# `hashbrown ^0.17`, itself also edition2024) starting at exactly
# 2.14.0.
#
# The edition fix alone isn't enough here: cargo build-sbf's bundled
# cargo checks each crate's declared `rust-version` (MSRV) against its
# own version (1.79.0-dev), independently of edition, and rejects
# anything whose MSRV is newer - a second, separate gate from
# edition2024 that an edition-only audit misses. indexmap 2.13.1 (the
# newest edition2021 release) itself declares `rust-version = "1.82"`,
# above 1.79, so it still fails even though its edition is fine.
# 2.11.4 is the newest indexmap release satisfying both constraints
# (edition2021, rust-version 1.63) and satisfies toml_edit's own
# "^2.11.4" requirement on indexmap (the only other thing in this
# graph that depends on it) at exactly its floor; its own hashbrown
# requirement (">=0.15.0, <0.17.0") is compatible with hashbrown
# 0.16.1, so the edition2024 hashbrown chain stays avoided too.
indexmap = "=2.11.4"

# Same MSRV gate as indexmap above (not an edition issue - both of
# these are edition2018/2021), caught by scanning every resolved
# crate's `rust-version` field against the platform-tools cargo's own
# version (1.79.0-dev), not just `edition`, after the previous pins
# still failed `anchor build` with "rustc 1.79.0-dev is not supported
# by the following packages". unicode-segmentation 1.13.3 (pulled in
# via anchor-syn/anchor-attribute-program's `heck 0.3.3` dependency,
# which declares unicode-segmentation "^1.2.0") declares rust-version
# 1.85.0; 1.12.0 is the newest release at or below 1.79 and satisfies
# heck's range. proc-macro-crate 3.5.0 (pulled in via borsh-derive
# 1.8.1's "^3" requirement) declares rust-version 1.82.0; 3.4.0 is the
# newest release at or below 1.79 and satisfies borsh-derive's range.
unicode-segmentation = "=1.12.0"
proc-macro-crate = "=3.4.0"

[profile.release]
overflow-checks = true
