[package]
name = "zrp-launchpad"
version = "0.1.0"
description = "ZRP-native Solana bonding-curve launch protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zrp_launchpad"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }

[profile.release]
overflow-checks = true
