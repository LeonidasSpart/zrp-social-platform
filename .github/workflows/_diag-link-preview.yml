name: DIAG - link preview live test
on:
  push:
    branches: [claude/diag-link-preview-live-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Post-fix verification - fresh never-cached 20min.ch URL against production
        run: |
          TS=$(date +%s)
          echo "--- ZRP production /api/link-preview, fresh cache-busted 20min.ch article, post-fix ---"
          curl -sS -o /tmp/zrp_postfix.json -w "HTTP_STATUS:%{http_code}\n" --max-time 20 \
            "https://zrp.one/api/link-preview?url=https%3A%2F%2Fwww.20min.ch%2Ffr%2Fstory%2Ffootball-atteinte-d-un-cancer-elle-voit-son-club-faire-un-geste-emouvant-103629744%3Fpostfixcheck%3D${TS}"
          cat /tmp/zrp_postfix.json
