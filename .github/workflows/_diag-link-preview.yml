name: DIAG - link preview live test
on:
  push:
    branches: [claude/diag-link-preview-live-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: DNS resolution of www.20min.ch
        run: |
          echo "--- getent ahosts ---"
          getent ahosts www.20min.ch || true
          echo "--- node dns.lookup(all:true) ---"
          node -e "require('dns').lookup('www.20min.ch',{all:true,verbatim:true},(e,a)=>console.log(e||a))"
      - name: Run the REAL repo safeFetch + parseHtmlMetadata against the real URL
        run: |
          npm install --no-save tsx 2>&1 | tail -5
          cat > /tmp/probe.ts << 'TSEOF'
          import { safeFetch } from "../src/lib/ssrf-guard";
          import { parseHtmlMetadata } from "../src/lib/link-preview-parse";

          async function main() {
            const url = "https://www.20min.ch/fr/story/football-atteinte-d-un-cancer-elle-voit-son-club-faire-un-geste-emouvant-103629744";
            try {
              const res = await safeFetch(url, {
                timeoutMs: 6000,
                maxBytes: 200_000,
                headers: {
                  "User-Agent": "Mozilla/5.0 (compatible; ZRPLinkPreview/1.0; +https://zrp.one)",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Accept-Encoding": "gzip, deflate, br",
                },
              });
              console.log("STATUS", res.statusCode);
              console.log("HEADERS", JSON.stringify(res.headers));
              console.log("BODY_LENGTH", res.body.length);
              const html = res.body.toString("utf-8");
              console.log("BODY_PREFIX", html.slice(0, 300));
              const preview = parseHtmlMetadata(html, url);
              console.log("PARSED", JSON.stringify(preview));
            } catch (e: any) {
              console.log("THREW", e?.name, e?.message, e?.stack);
            }
          }
          main();
          TSEOF
          npx tsx /tmp/probe.ts
        working-directory: .
