name: DIAG - link preview live test
on:
  push:
    branches: [claude/diag-link-preview-live-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Re-test the exact original URL (checks current cached state)
        run: |
          echo "--- ZRP production /api/link-preview, ORIGINAL url ---"
          curl -sS -o /tmp/zrp_orig.json -w "HTTP_STATUS:%{http_code}\n" --max-time 20 \
            "https://zrp.one/api/link-preview?url=https%3A%2F%2Fwww.20min.ch%2Ffr%2Fstory%2Ffootball-atteinte-d-un-cancer-elle-voit-son-club-faire-un-geste-emouvant-103629744"
          cat /tmp/zrp_orig.json
      - name: Cache-busted variant (forces a fresh server-side fetch, bypasses Redis cache key)
        run: |
          echo "--- ZRP production /api/link-preview, CACHE-BUSTED url (same page, different query string -> different cache key) ---"
          curl -sS -o /tmp/zrp_bust.json -w "HTTP_STATUS:%{http_code}\n" --max-time 20 \
            "https://zrp.one/api/link-preview?url=https%3A%2F%2Fwww.20min.ch%2Ffr%2Fstory%2Ffootball-atteinte-d-un-cancer-elle-voit-son-club-faire-un-geste-emouvant-103629744%3Fzrpcachebust%3D$(date +%s)"
          cat /tmp/zrp_bust.json
      - name: Test a different, never-before-seen 20min.ch article (guaranteed no cache entry)
        run: |
          echo "--- ZRP production /api/link-preview, DIFFERENT never-cached 20min.ch article ---"
          curl -sS -o /tmp/zrp_fresh.json -w "HTTP_STATUS:%{http_code}\n" --max-time 20 \
            "https://zrp.one/api/link-preview?url=https%3A%2F%2Fwww.20min.ch%2Ffr"
          cat /tmp/zrp_fresh.json
