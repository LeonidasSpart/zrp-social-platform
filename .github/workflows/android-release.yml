name: Android Release Build

# Builds the ZRP Social Android App Bundle (.aab) for Google Play.
#
# This runs on GitHub's own infrastructure specifically because the
# Android SDK (dl.google.com) isn't reachable from every development
# environment - GitHub Actions runners have normal, unrestricted
# internet access.
#
# Signing: activates automatically once the real upload keystore exists
# as repository secrets - this workflow never generates a keystore.
# android/app/build.gradle only applies a release signingConfig when
# android/keystore.properties exists, which the "Configure release
# signing" step below only writes when the four ANDROID_KEYSTORE_*
# secrets are present AND the decoded keystore passes a keytool
# validation check. Until then, or if a secret is wrong, bundleRelease
# still runs and produces a real .aab - useful for verifying the rest
# of the pipeline - but it is UNSIGNED and must never be uploaded to
# Play Console as-is; the workflow logs an explicit warning either way.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The Capacitor CLI (npx cap sync) requires Node >=22.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      # ── Release signing ────────────────────────────────────────────
      # Required secrets: ANDROID_KEYSTORE_BASE64 (`base64 -w0
      # your-release-key.jks`), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      #
      # The keystore is decoded to a file under $RUNNER_TEMP - a
      # per-run temporary directory outside the git working tree,
      # never included in any artifact upload, and removed explicitly
      # in the cleanup step below regardless of build outcome.
      #
      # Never echo $ANDROID_KEYSTORE_BASE64, the passwords, or the
      # decoded keystore's contents anywhere in this script.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set - skipping signing setup, the .aab will be unsigned."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/zrp-release.keystore"

          # A base64 secret pasted through different tools/clipboards/
          # OSes can pick up stray whitespace, CRLF line endings, or a
          # shell prompt's trailing '%' from a copy - none of that is
          # valid base64, and a single stray character anywhere is
          # enough for `base64 -d` to fail with a bare "invalid input"
          # that doesn't say where. Strip all whitespace defensively
          # before decoding rather than requiring the secret to be
          # pasted in exactly one specific format.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a non-empty file - its stored value is not valid base64. Regenerate it from the real keystore (e.g. 'base64 -w0 zrp-upload-key.jks') and reset the repository secret."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          # Confirm the decoded bytes are actually a usable keystore
          # containing the expected alias before trusting them to
          # Gradle - a wrong secret must fail here, loudly and
          # specifically, rather than silently producing a build that
          # "succeeds" but is unsigned or uses the wrong key.
          if ! keytool -list -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The decoded keystore failed keytool validation for alias '$ANDROID_KEY_ALIAS'. This is a different failure than a base64 decode error - it means the file decoded fine but ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, or the keystore contents itself don't match. Verify each secret against the real keystore and reset them."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          echo "storeFile=$KEYSTORE_PATH" > android/keystore.properties
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/keystore.properties

          echo "Keystore decoded and validated (alias '$ANDROID_KEY_ALIAS' confirmed present)."

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Report signing status
        run: |
          if [ -f android/keystore.properties ]; then
            echo "Release signing: CONFIGURED - this .aab is signed."
          else
            echo "::warning::Release signing NOT configured or the provided secrets failed validation - this .aab is UNSIGNED. Do not upload it to Google Play Console."
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrp-social-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Belt-and-suspenders: $RUNNER_TEMP and the whole workspace are
      # destroyed with the runner regardless, but clean up explicitly
      # and unconditionally so no signing material lingers for even the
      # remainder of the job (e.g. in later steps' working directory).
      - name: Clean up temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zrp-release.keystore" android/keystore.properties
