name: Android Release Build

# Builds the ZRP Social Android App Bundle (.aab) for Google Play.
#
# This runs on GitHub's own infrastructure specifically because the
# Android SDK (dl.google.com) isn't reachable from every development
# environment - GitHub Actions runners have normal, unrestricted
# internet access.
#
# Signing: intentionally not configured yet. android/app/build.gradle
# only applies a release signingConfig when android/keystore.properties
# exists, which this workflow only creates when the four
# ANDROID_KEYSTORE_* secrets below are present in the repository. Until
# someone adds those secrets, this workflow still runs the full build
# pipeline end to end and uploads the resulting .aab as a build
# artifact - it will be UNSIGNED and must never be uploaded to Play
# Console as-is. This workflow never generates a keystore itself.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      # ── Release signing (add the secrets below to activate) ──────
      # ANDROID_KEYSTORE_BASE64  - `base64 -w0 your-release-key.jks`
      # ANDROID_KEYSTORE_PASSWORD
      # ANDROID_KEY_ALIAS
      # ANDROID_KEY_PASSWORD
      #
      # Decodes the keystore to a file inside the (gitignored, ephemeral
      # runner-only) android/app/ directory and writes
      # android/keystore.properties, which build.gradle's conditional
      # signingConfig picks up with no further changes needed anywhere.
      # This step is a no-op - and the resulting .aab stays unsigned -
      # until all four secrets exist.
      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Report signing status
        run: |
          if [ -f android/keystore.properties ]; then
            echo "Release signing: CONFIGURED - this .aab is signed."
          else
            echo "::warning::Release signing NOT configured - this .aab is UNSIGNED. Do not upload it to Google Play Console. Add the ANDROID_KEYSTORE_* secrets to enable signing."
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrp-social-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
