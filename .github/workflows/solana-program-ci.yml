name: ZRP Launchpad Solana Program

# Builds, tests and deploys the ZRP-native bonding-curve program
# (programs/zrp-launchpad/) that replaces Pump.fun as ZRP's token-creation
# protocol. This is the verification oracle for that program: the
# development sandbox this repo is normally edited in has no network path
# to crates.io or any Solana RPC endpoint, so nothing here can be compiled
# or tested locally - every change to programs/zrp-launchpad/ must be
# proven here, in CI, before it's trusted.
#
# Three jobs, in increasing order of consequence:
#   1. build-and-test  - PRs, pushes to main, and manual runs. Compiles the
#      program and runs the full Anchor test suite (tests/zrp-launchpad.ts)
#      against a fresh local-validator. No deploy, no funds at risk.
#   2. deploy-devnet   - push to main only. Deploys to Solana devnet using
#      the devnet program keypair committed in this repo
#      (programs/zrp-launchpad/keys/) - devnet SOL has no value, so this is
#      safe to automate the same way android-native-build.yml auto-builds a
#      debug APK on every change to main.
#   3. deploy-mainnet  - manual-only (workflow_dispatch), requires typing an
#      exact confirmation phrase, and needs two repository secrets
#      (SOLANA_MAINNET_PROGRAM_KEYPAIR, SOLANA_MAINNET_DEPLOYER_KEYPAIR)
#      that must be provisioned and funded by a human first - this workflow
#      cannot create or fund them, matching android-native-build.yml's own
#      "release signing only on push to main / workflow_dispatch, secrets
#      decoded and validated before use, never logged" convention for the
#      other irreversible, real-money-adjacent artifact in this repo.
on:
  pull_request:
    paths:
      - "programs/**"
      - "tests/zrp-launchpad.ts"
      - "Anchor.toml"
      - "Cargo.toml"
      - ".github/workflows/solana-program-ci.yml"
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "tests/zrp-launchpad.ts"
      - "Anchor.toml"
      - "Cargo.toml"
      - ".github/workflows/solana-program-ci.yml"
  workflow_dispatch:
    inputs:
      confirm_mainnet_deploy:
        description: >-
          Type exactly DEPLOY ZRP LAUNCHPAD TO MAINNET to run the mainnet
          deploy job. Any other value (including empty) runs build-and-test
          only - this is deliberately not a checkbox, so it can't be
          triggered by habit.
        required: false
        default: ""

permissions:
  contents: read

env:
  SOLANA_VERSION: "2.1.0"
  ANCHOR_VERSION: "0.31.1"
  # This is the HOST toolchain used only to build/install the anchor-cli
  # binary and drive cargo as a build tool - it never compiles the
  # on-chain program itself (anchor build / cargo build-sbf download and
  # use Solana's own bundled platform-tools Rust fork for that, completely
  # independent of this value). Pinning an exact version here caused a
  # real failure: anchor-cli 0.31.1 was published against crates.io's
  # dependency graph as it existed in April 2025, and by the time this
  # runs, transitive deps (observed: zeroize) had moved on to releases
  # requiring a newer Cargo edition than an old pinned host toolchain
  # supports. "stable" always matches what crates.io's current graph
  # needs, which is exactly the property this host toolchain needs to
  # have - unlike the on-chain program/SPL-dependency versions, which
  # stay genuinely pinned via Cargo.lock.
  RUST_TOOLCHAIN: "stable"

jobs:
  build-and-test:
    name: Build program + run Anchor test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # cargo build-sbf (invoked by `anchor build` below) uses Solana's own
      # bundled "platform-tools" cross-compiler to actually compile the
      # on-chain program - an old, fixed Cargo (1.79 as of SOLANA_VERSION
      # 2.1.0) that predates the `edition2024` Cargo feature. The
      # dependency graph gets re-resolved against crates.io's CURRENT
      # state on every run (no Cargo.lock is committed - cargo build-sbf's
      # own cargo is too old to reliably consume one generated by a newer
      # resolver, see git history on this file), and deep transitive
      # utility crates nobody in this program calls directly keep
      # publishing editions2024 releases over time as the wider Rust
      # ecosystem migrates - a problem that will keep recurring
      # regardless of which exact versions are pinned below. Confirmed so
      # far: zeroize (pinned to 1.8.2 in programs/zrp-launchpad/Cargo.toml)
      # and toml_edit (pinned to 0.25.5+spec-1.1.0, same file) - each
      # pinned as a direct dependency of the program crate itself (even
      # though its own code never imports them), which is what forces the
      # workspace's single unified resolution to use that version
      # everywhere instead of floating to the newest edition2024 release.
      #
      # This step resolves the graph with the HOST's modern "stable"
      # cargo (which parses edition2024 fine, unlike cargo build-sbf's
      # bundled one) purely as a diagnostic - printing which crate(s)
      # still need pinning next shows up here before `anchor build`
      # itself fails on it.
      - name: "Resolve dependency graph (diagnostic: print reverse-deps of known-pinned crates)"
        run: |
          cargo generate-lockfile
          echo "--- reverse dependencies: zeroize (pinned to 1.8.2) ---"
          cargo tree -i zeroize || true
          echo "--- reverse dependencies: zeroize_derive (pinned to 1.4.2) ---"
          cargo tree -i zeroize_derive || true
          echo "--- reverse dependencies: toml_edit (pinned to 0.25.5) ---"
          cargo tree -i toml_edit || true
          echo "--- reverse dependencies: toml_datetime/toml_writer/toml_parser (pinned) ---"
          cargo tree -i toml_datetime || true
          cargo tree -i toml_writer || true
          cargo tree -i toml_parser || true
          echo "--- reverse dependencies: blake3 (pinned to 1.5.5) ---"
          cargo tree -i blake3 || true
          echo "--- reverse dependencies: indexmap (pinned to 2.13.1) ---"
          cargo tree -i indexmap || true
          echo "--- reverse dependencies: digest (should no longer resolve to 0.11.x) ---"
          cargo tree -i digest || true
          echo "--- reverse dependencies: hashbrown (should no longer resolve to 0.17.x) ---"
          cargo tree -i hashbrown || true

      - name: "Fail fast if any resolved crate still requires edition2024"
        run: cargo metadata --format-version 1 | python3 .github/scripts/check-no-edition2024.py

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Node (for the TS test suite)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install repo npm dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Anchor CLI install
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-${{ env.ANCHOR_VERSION }}

      # anchor-cli links against libudev (hardware-wallet/hidapi support in
      # its Solana CLI dependencies), which isn't guaranteed present on the
      # bare runner image.
      - name: Install system build dependencies for Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: |
          # avm (Anchor's version-switcher) isn't published as its own
          # crate on crates.io - `cargo install avm` resolves to an
          # unrelated package of the same name, and installing it via
          # `--git .../anchor` builds it from the monorepo's current HEAD,
          # which drifts independently of the pinned ANCHOR_VERSION and can
          # require a newer Cargo edition than RUST_TOOLCHAIN provides
          # (observed: HEAD required edition2024, unavailable on Rust
          # 1.82). Installing `anchor-cli` itself, directly, from crates.io
          # at the exact pinned version sidesteps avm entirely and keeps
          # the toolchain reproducible.
          cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }} --locked --force

      - name: Verify Anchor ${{ env.ANCHOR_VERSION }}
        run: anchor --version

      - name: Generate ephemeral local wallet (test fee-payer, no real funds)
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json

      # Wires this program's permanent devnet identity
      # (programs/zrp-launchpad/keys/zrp-launchpad-devnet-keypair.json, whose
      # public key is the `declare_id!` in lib.rs and the [programs.*]
      # entries in Anchor.toml) into the path `anchor build` expects it at.
      # This keypair only ever signs as the program's own address during
      # (re)deploys - it is never the fee-payer/wallet above.
      - name: Place program identity keypair for build
        run: |
          mkdir -p target/deploy
          cp programs/zrp-launchpad/keys/zrp-launchpad-devnet-keypair.json target/deploy/zrp_launchpad-keypair.json

      - name: anchor build
        run: anchor build

      - name: Verify declare_id! matches the committed program keypair
        run: |
          DECLARED_ID=$(grep -oE '"[1-9A-HJ-NP-Za-km-z]{32,44}"' programs/zrp-launchpad/src/lib.rs | head -1 | tr -d '"')
          KEYPAIR_ID=$(solana-keygen pubkey target/deploy/zrp_launchpad-keypair.json)
          echo "declare_id!: $DECLARED_ID"
          echo "keypair:     $KEYPAIR_ID"
          if [ "$DECLARED_ID" != "$KEYPAIR_ID" ]; then
            echo "::error::declare_id! in lib.rs does not match the committed devnet program keypair - anchor build/deploy would target the wrong program."
            exit 1
          fi

      - name: anchor test (local validator, Metaplex cloned from mainnet)
        run: anchor test --skip-build

      - name: Upload build artifacts (.so + generated IDL/types)
        uses: actions/upload-artifact@v4
        with:
          name: zrp-launchpad-build
          path: |
            target/deploy/zrp_launchpad.so
            target/idl/zrp_launchpad.json
            target/types/zrp_launchpad.ts
          if-no-files-found: error
          retention-days: 30

  deploy-devnet:
    name: Deploy to devnet
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install system build dependencies for Anchor CLI
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        run: cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }} --locked --force

      # The DEPLOYER wallet pays rent/fees and (for repeat deploys) must
      # match whatever account is currently the program's upgrade
      # authority - never the program's own identity keypair. Two optional
      # repo secrets make this reliable instead of depending on the public
      # devnet faucet every run (it's shared infrastructure and frequently
      # rate-limits CI IP ranges):
      #   SOLANA_RPC_URL           - a dedicated devnet RPC endpoint. Falls
      #                              back to the public https://api.devnet.solana.com
      #                              if unset.
      #   SOLANA_DEPLOYER_KEYPAIR  - a persistent devnet keypair JSON,
      #                              pre-funded by a human once (e.g.
      #                              `solana airdrop 5` run locally, or a
      #                              devnet faucet website). Falls back to a
      #                              fresh ephemeral keypair + CI-driven
      #                              faucet airdrop if unset - fine for an
      #                              occasional run, flaky under heavier use.
      # Neither secret is required for this job to exist; both are
      # documented in docs/zrp-launchpad-deployment.md.
      - name: Configure deployer wallet
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_DEPLOYER_KEYPAIR: ${{ secrets.SOLANA_DEPLOYER_KEYPAIR }}
        run: |
          mkdir -p ~/.config/solana
          RPC_URL="${SOLANA_RPC_URL:-https://api.devnet.solana.com}"
          solana config set --url "$RPC_URL"
          echo "RPC_URL=$RPC_URL" >> "$GITHUB_ENV"

          if [ -n "$SOLANA_DEPLOYER_KEYPAIR" ]; then
            printf '%s' "$SOLANA_DEPLOYER_KEYPAIR" > ~/.config/solana/id.json
            if ! solana-keygen pubkey ~/.config/solana/id.json > /dev/null 2>&1; then
              echo "::error::SOLANA_DEPLOYER_KEYPAIR is not a valid Solana keypair JSON."
              exit 1
            fi
            echo "Using the persistent SOLANA_DEPLOYER_KEYPAIR secret."
          else
            solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
            echo "No SOLANA_DEPLOYER_KEYPAIR secret set - generated an ephemeral deployer wallet for this run."
          fi

      - name: Fund deployer (airdrop if balance is low)
        run: |
          BALANCE=$(solana balance --url "$RPC_URL" | awk '{print $1}')
          echo "Current balance: $BALANCE SOL"
          NEEDS_FUNDING=$(awk -v bal="$BALANCE" 'BEGIN { print (bal < 2) ? 1 : 0 }')
          if [ "$NEEDS_FUNDING" = "1" ]; then
            for i in 1 2 3 4 5; do
              solana airdrop 2 --url "$RPC_URL" && break
              echo "Airdrop attempt $i failed/rate-limited, retrying in 10s..."
              sleep 10
            done
          fi
          solana balance --url "$RPC_URL"

      - name: Place program identity keypair for build
        run: |
          mkdir -p target/deploy
          cp programs/zrp-launchpad/keys/zrp-launchpad-devnet-keypair.json target/deploy/zrp_launchpad-keypair.json

      - name: anchor build
        run: anchor build

      - name: Deploy to devnet
        run: |
          anchor deploy --provider.cluster "$RPC_URL" --provider.wallet ~/.config/solana/id.json \
            --program-name zrp_launchpad \
            --program-keypair target/deploy/zrp_launchpad-keypair.json

      - name: Set upgrade authority to the program's own keypair
        run: |
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/zrp_launchpad-keypair.json)
          solana program set-upgrade-authority "$PROGRAM_ID" \
            --new-upgrade-authority target/deploy/zrp_launchpad-keypair.json \
            --upgrade-authority ~/.config/solana/id.json \
            --url "$RPC_URL" || echo "Upgrade authority already set (expected on repeat deploys) or program is immutable - continuing."

      - name: Report deployed program
        run: |
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/zrp_launchpad-keypair.json)
          echo "## ZRP Launchpad deployed to devnet" >> "$GITHUB_STEP_SUMMARY"
          echo "- Program ID: \`$PROGRAM_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- RPC: \`$RPC_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IDL + types for the verification job
        uses: actions/upload-artifact@v4
        with:
          name: zrp-launchpad-devnet-deploy
          path: |
            target/idl/zrp_launchpad.json
            target/types/zrp_launchpad.ts
          if-no-files-found: error
          retention-days: 30

  verify-devnet:
    name: Verify devnet deployment (real on-chain smoke test)
    needs: deploy-devnet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install repo npm dependencies
        run: npm install --no-audit --no-fund

      - name: Download IDL from the deploy job
        uses: actions/download-artifact@v4
        with:
          name: zrp-launchpad-devnet-deploy
          path: target

      # Same secret-or-fallback pattern as deploy-devnet. The smoke test
      # spends real (free, worthless) devnet SOL across create + 3 buys +
      # a sell + graduate - noticeably more than a bare deploy, so the
      # funding floor here is higher.
      - name: Configure smoke-test wallet
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_DEPLOYER_KEYPAIR: ${{ secrets.SOLANA_DEPLOYER_KEYPAIR }}
        run: |
          mkdir -p ~/.config/solana
          RPC_URL="${SOLANA_RPC_URL:-https://api.devnet.solana.com}"
          solana config set --url "$RPC_URL"
          echo "RPC_URL=$RPC_URL" >> "$GITHUB_ENV"

          if [ -n "$SOLANA_DEPLOYER_KEYPAIR" ]; then
            printf '%s' "$SOLANA_DEPLOYER_KEYPAIR" > ~/.config/solana/id.json
          else
            solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
          fi

          BALANCE=$(solana balance --url "$RPC_URL" | awk '{print $1}')
          NEEDS_FUNDING=$(awk -v bal="$BALANCE" 'BEGIN { print (bal < 8) ? 1 : 0 }')
          if [ "$NEEDS_FUNDING" = "1" ]; then
            for i in 1 2 3 4 5 6 7 8; do
              solana airdrop 2 --url "$RPC_URL" || true
              BALANCE=$(solana balance --url "$RPC_URL" | awk '{print $1}')
              awk -v bal="$BALANCE" 'BEGIN { exit !(bal >= 8) }' && break
              echo "Balance $BALANCE SOL after attempt $i, retrying in 10s..."
              sleep 10
            done
          fi
          solana balance --url "$RPC_URL"

      # DEPLOYER_KEYPAIR_PATH is deliberately not set here - the script
      # defaults it to $HOME/.config/solana/id.json, which is exactly where
      # the step above wrote it, and resolving $HOME at Node runtime avoids
      # hardcoding a runner-specific home directory in this YAML.
      - name: Run verification + full on-chain smoke test
        env:
          SOLANA_RPC_URL: ${{ env.RPC_URL }}
          IDL_PATH: target/idl/zrp_launchpad.json
          RUN_SMOKE_TEST: "true"
        run: npx ts-node --project tsconfig.anchor.json scripts/verify-zrp-launchpad.ts

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrp-launchpad-devnet-verification-report
          path: devnet-verification-report.json
          if-no-files-found: warn
          retention-days: 90

  deploy-mainnet:
    name: Deploy to mainnet (manual, gated)
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm_mainnet_deploy == 'DEPLOY ZRP LAUNCHPAD TO MAINNET'
    runs-on: ubuntu-latest
    environment: solana-mainnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install system build dependencies for Anchor CLI
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        run: cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }} --locked --force

      # Both secrets are provisioned and funded by a human ahead of time -
      # this workflow never generates or funds a mainnet keypair itself.
      # SOLANA_MAINNET_PROGRAM_KEYPAIR is the program's permanent on-chain
      # identity (its pubkey becomes the real, final mainnet program ID -
      # generate it ONCE, store it only as this secret, never commit it).
      # SOLANA_MAINNET_DEPLOYER_KEYPAIR pays the deploy rent/fees (several
      # SOL for a program this size) and is set as upgrade authority.
      - name: Decode mainnet secrets
        env:
          SOLANA_MAINNET_PROGRAM_KEYPAIR: ${{ secrets.SOLANA_MAINNET_PROGRAM_KEYPAIR }}
          SOLANA_MAINNET_DEPLOYER_KEYPAIR: ${{ secrets.SOLANA_MAINNET_DEPLOYER_KEYPAIR }}
        run: |
          if [ -z "$SOLANA_MAINNET_PROGRAM_KEYPAIR" ] || [ -z "$SOLANA_MAINNET_DEPLOYER_KEYPAIR" ]; then
            echo "::error::SOLANA_MAINNET_PROGRAM_KEYPAIR and/or SOLANA_MAINNET_DEPLOYER_KEYPAIR repository secrets are not set. A human must generate, fund (deployer only) and store both before this job can run. Nothing was deployed."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mainnet-keys"
          printf '%s' "$SOLANA_MAINNET_PROGRAM_KEYPAIR" > "$RUNNER_TEMP/mainnet-keys/program-keypair.json"
          printf '%s' "$SOLANA_MAINNET_DEPLOYER_KEYPAIR" > "$RUNNER_TEMP/mainnet-keys/deployer-keypair.json"
          if ! solana-keygen pubkey "$RUNNER_TEMP/mainnet-keys/program-keypair.json" > /dev/null 2>&1; then
            echo "::error::SOLANA_MAINNET_PROGRAM_KEYPAIR is not a valid Solana keypair JSON."
            exit 1
          fi
          if ! solana-keygen pubkey "$RUNNER_TEMP/mainnet-keys/deployer-keypair.json" > /dev/null 2>&1; then
            echo "::error::SOLANA_MAINNET_DEPLOYER_KEYPAIR is not a valid Solana keypair JSON."
            exit 1
          fi

      - name: Build with the mainnet program identity
        run: |
          mkdir -p target/deploy
          cp "$RUNNER_TEMP/mainnet-keys/program-keypair.json" target/deploy/zrp_launchpad-keypair.json
          MAINNET_PROGRAM_ID=$(solana-keygen pubkey target/deploy/zrp_launchpad-keypair.json)
          sed -i "s/declare_id!(\"[^\"]*\");/declare_id!(\"$MAINNET_PROGRAM_ID\");/" programs/zrp-launchpad/src/lib.rs
          anchor build

      - name: Check deployer balance
        run: |
          solana config set --url mainnet-beta
          BALANCE=$(solana balance "$RUNNER_TEMP/mainnet-keys/deployer-keypair.json" --url mainnet-beta | awk '{print $1}')
          echo "Deployer balance: $BALANCE SOL"
          # Program deploys for a project this size typically cost ~3-6 SOL
          # in rent; fail closed with a clear message rather than letting
          # `anchor deploy` fail midway with a partially-written buffer.
          awk -v bal="$BALANCE" 'BEGIN { exit !(bal >= 3) }' || {
            echo "::error::Deployer wallet balance ($BALANCE SOL) looks too low for a mainnet program deploy. Fund it and re-run."
            exit 1
          }

      - name: Deploy to mainnet-beta
        run: |
          anchor deploy --provider.cluster mainnet --provider.wallet "$RUNNER_TEMP/mainnet-keys/deployer-keypair.json" \
            --program-name zrp_launchpad \
            --program-keypair target/deploy/zrp_launchpad-keypair.json

      - name: Report deployed program
        run: |
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/zrp_launchpad-keypair.json)
          echo "## ZRP Launchpad deployed to mainnet-beta" >> "$GITHUB_STEP_SUMMARY"
          echo "- Program ID: \`$PROGRAM_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explorer: https://explorer.solana.com/address/$PROGRAM_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Record this program ID in ZRP_LAUNCH_PROGRAM_ID (env) for the TS client and server verification to use."

      - name: Clean up mainnet key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mainnet-keys"
