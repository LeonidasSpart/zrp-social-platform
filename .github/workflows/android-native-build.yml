name: Native Android App Build

# Builds the ZRP Social native Android app (android-native/) - the
# genuine Kotlin/Jetpack Compose app that is replacing the Capacitor
# WebView shell (android/), which its own separate workflow
# (android-release.yml) continues to build unchanged.
#
# Two jobs: a debug APK on every change (this module has no Play Store
# listing of its own yet - internal testing only until feature parity),
# and a release .aab using the exact same real upload keystore already
# validated as this repo's ANDROID_KEYSTORE_* secrets for android/ - see
# the release job's own comments for why reusing it (rather than a
# second keystore) is correct here. Runs on GitHub's infrastructure
# because the Android SDK (dl.google.com) isn't reachable from every
# development environment.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-build.yml"
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      # GOOGLE_WEB_CLIENT_ID isn't sensitive (OAuth client IDs are public
      # identifiers, unlike a client secret) but is still sourced from a
      # repo secret rather than hardcoded, matching keystore.properties'
      # own "supplied at build time, never committed" pattern - see
      # build.gradle's own comment. An empty/unset secret still builds
      # fine (GoogleAuth.kt's call just fails at runtime with a clear
      # error), so this never blocks a build that doesn't need it yet.
      - name: Build debug APK
        working-directory: android-native
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleDebug --no-daemon "-PGOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      # The debug build now signs with the checked-in android-native/
      # debug.keystore (see build.gradle's own comment) specifically so
      # this fingerprint is STABLE across every run - unlike Gradle's
      # default auto-generated debug keystore, which is a different
      # certificate on every CI runner. Google Sign-In (Credential
      # Manager) will not return a credential for a signing certificate
      # that isn't registered as an Android OAuth client in the
      # "zrp-social" Firebase/Google Cloud project - confirmed by
      # google-services.json's own empty "oauth_client": []. Printing
      # this here gives whoever owns that Console the exact value to
      # register, once, for package "one.zrp.social".
      - name: Print debug certificate fingerprint (for Google Sign-In setup)
        run: |
          keytool -list -v -keystore android-native/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep -E "SHA1:|SHA256:"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrp-social-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build release AAB
    runs-on: ubuntu-latest
    # ⚠️ SECURITY: the release (signing) job runs ONLY for trusted
    # triggers - a push to main or a manual workflow_dispatch - never
    # for a pull_request. GitHub withholds repository secrets from PRs
    # opened from a fork, but a PR from a branch in this same repository
    # receives them, and this job used to run for every such PR: anyone
    # able to open a same-repo PR could have modified this workflow (or
    # the Gradle files it invokes) in that same PR to exfiltrate the
    # production upload keystore. PRs still get the full debug-APK build
    # job above as their end-to-end check.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      # ── Release signing ────────────────────────────────────────────
      # Reuses the exact same ANDROID_KEYSTORE_* secrets android-release.yml
      # already uses to sign android/ (the Capacitor app) - not a second
      # keystore. Both apps ship under the identical applicationId
      # "one.zrp.social" (see app/build.gradle's own comment on that), and
      # this native app is the eventual replacement for that same Play
      # Store listing, so it has to be signed with the same upload key for
      # Play to ever accept it as an update rather than a conflicting app.
      # Never invent a separate keystore here.
      #
      # The keystore is decoded to a file under $RUNNER_TEMP - a per-run
      # temporary directory outside the git working tree, never included
      # in any artifact upload, and removed explicitly in the cleanup step
      # below regardless of build outcome.
      #
      # Never echo $ANDROID_KEYSTORE_BASE64, the passwords, or the decoded
      # keystore's contents anywhere in this script.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set - skipping signing setup, the .aab will be unsigned."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/zrp-native-release.keystore"

          # See android-release.yml's identical step for why whitespace is
          # stripped defensively and why `|| true` matters here (bash -e
          # would otherwise abort the whole step on a bad decode before
          # the actionable checks below ever run).
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH" 2>/dev/null || true

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a non-empty file - see android-release.yml's identical check for likely causes."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The decoded keystore failed keytool validation for alias '$ANDROID_KEY_ALIAS'. Verify each secret against the real keystore and reset them."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          echo "storeFile=$KEYSTORE_PATH" > android-native/keystore.properties
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android-native/keystore.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android-native/keystore.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android-native/keystore.properties

          echo "Keystore decoded and validated (alias '$ANDROID_KEY_ALIAS' confirmed present)."

      - name: Build release AAB
        working-directory: android-native
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew bundleRelease --no-daemon "-PGOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Report signing status
        run: |
          if [ -f android-native/keystore.properties ]; then
            echo "Release signing: CONFIGURED - this .aab is signed."
          else
            echo "::warning::Release signing NOT configured or the provided secrets failed validation - this .aab is UNSIGNED. Do not upload it to Google Play Console."
          fi

      # Reads the versionCode/versionName/applicationId Gradle actually
      # embedded in the built bundle's manifest, rather than trusting that
      # build.gradle's source values made it through unchanged. bundletool
      # is Google's own tool for inspecting an .aab (an .aab's manifest is
      # binary AXML inside a zip of per-module protobuf, so plain
      # `aapt2 dump badging` - which only understands APKs - can't read it
      # directly). Pinned to a fixed release so this step's behavior
      # doesn't shift under an unrelated build. applicationId is asserted
      # against the one Play Store listing both android/ and android-native/
      # ship under (see app/build.gradle's own comment) - it must never
      # silently change; versionCode/versionName are printed, not
      # asserted, since the correct value is different on every release.
      - name: Verify release AAB contents (versionCode/versionName/applicationId)
        run: |
          BUNDLETOOL_VERSION="1.15.6"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          AAB_PATH="android-native/app/build/outputs/bundle/release/app-release.aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB_PATH" > "$RUNNER_TEMP/manifest_dump.xml"

          echo "── Decoded AndroidManifest.xml from the built .aab ──"
          cat "$RUNNER_TEMP/manifest_dump.xml"

          APP_ID=$(grep -oE 'package="[^"]*"' "$RUNNER_TEMP/manifest_dump.xml" | head -1 | cut -d'"' -f2)
          VERSION_CODE=$(grep -oE 'versionCode="[^"]*"' "$RUNNER_TEMP/manifest_dump.xml" | head -1 | cut -d'"' -f2)
          VERSION_NAME=$(grep -oE 'versionName="[^"]*"' "$RUNNER_TEMP/manifest_dump.xml" | head -1 | cut -d'"' -f2)

          echo "applicationId=$APP_ID"
          echo "versionCode=$VERSION_CODE"
          echo "versionName=$VERSION_NAME"

          if [ "$APP_ID" != "one.zrp.social" ]; then
            echo "::error::Built .aab has applicationId '$APP_ID', expected 'one.zrp.social' - this would not update the existing Play Store listing."
            exit 1
          fi

      # A certificate's SHA-256 fingerprint is the public half of the
      # signing key pair - the same value Play Console itself displays
      # under App Integrity, and exactly what a
      # https://zrp.one/.well-known/assetlinks.json needs to turn on
      # verified Android App Links (see AndroidManifest.xml's intent-filter
      # comment on android:autoVerify). Safe to print: unlike the keystore
      # passwords or the .jks file itself, this is meant to be published.
      - name: Print release certificate fingerprint (for assetlinks.json)
        if: always()
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/zrp-native-release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "No keystore was decoded this run - nothing to fingerprint."
            exit 0
          fi
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep -E "SHA1:|SHA256:"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrp-social-native-release-aab
          path: android-native/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Belt-and-suspenders: $RUNNER_TEMP and the whole workspace are
      # destroyed with the runner regardless, but clean up explicitly and
      # unconditionally so no signing material lingers for even the
      # remainder of the job.
      - name: Clean up temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zrp-native-release.keystore" android-native/keystore.properties
