name: Native Android App Build

# Builds the ZRP Social native Android app (android-native/) - the
# genuine Kotlin/Jetpack Compose app that is replacing the Capacitor
# WebView shell (android/), which its own separate workflow
# (android-release.yml) continues to build unchanged.
#
# This is a debug assemble only, not a signed release build - this
# module has no Play Store listing of its own yet (see the migration
# plan: internal testing only until feature parity). Runs on GitHub's
# infrastructure because the Android SDK (dl.google.com) isn't reachable
# from every development environment.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-build.yml"
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrp-social-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
